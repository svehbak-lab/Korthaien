# Repoet inneholder to prosjekter. rootDir peker Render inn i riktig mappe —
# uten den bygger den KARDEX fra rota, som ikke har noe her å gjøre.
services:
  - type: web
    name: korthaien-kjop-api
    runtime: node
    plan: starter
    rootDir: korthaien-kjop
    # Turso-databasen ligger i Irland. Står tjenesten i USA, går hvert
    # databasekall over Atlanteren og tilbake.
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false        # libsql://<db>.turso.io
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        # Kommaseparert. Både kundesiden og admin må stå her, ellers laster
        # siden fint og alle kall feiler.
        value: https://kortsalg.korthaien.no,https://admin.kortsalg.korthaien.no
      - key: MYSTORE_URL
        sync: false
      - key: MYSTORE_KEY
        sync: false
      - key: RESEND_KEY
        sync: false

  # Kundesiden. Statiske filer — Vite bygger dem, Render serverer dem.
  # VITE_API_URL bakes inn ved bygging, ikke ved kjøring, så en endring her
  # krever et nytt bygg.
  - type: web
    name: korthaien-kjop-kunde
    runtime: static
    rootDir: korthaien-kjop/kunde
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://api.kortsalg.korthaien.no

  # Admin. Samme opplegg, men beskyttet av passord og engangskode.
  - type: web
    name: korthaien-kjop-admin
    runtime: static
    rootDir: korthaien-kjop/admin
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://api.kortsalg.korthaien.no

  # Scryfall oppdaterer bulk-filene daglig. Kjøres nattestid.
  - type: cron
    name: korthaien-kjop-import
    runtime: node
    rootDir: korthaien-kjop
    region: frankfurt
    schedule: "0 3 * * *"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/cli.js import
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false

  # Beholdningen endrer seg gjennom dagen, så denne går oftere.
  - type: cron
    name: korthaien-kjop-mystore
    runtime: node
    rootDir: korthaien-kjop
    region: frankfurt
    schedule: "0 */4 * * *"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/cli.js mystore
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: MYSTORE_URL
        sync: false
      - key: MYSTORE_KEY
        sync: false
