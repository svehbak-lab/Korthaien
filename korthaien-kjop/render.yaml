# Repoet inneholder to prosjekter. rootDir peker Render inn i riktig mappe —
# uten den bygger den KARDEX fra rota, som ikke har noe her å gjøre.
services:
  - type: web
    name: korthaien-kjop-api
    runtime: node
    plan: starter
    rootDir: korthaien-kjop
    # Turso-databasen ligger i Irland. Står tjenesten i USA, går hvert
    # databasekall over Atlanteren og tilbake.
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false        # libsql://<db>.turso.io
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        # Kommaseparert. Både kundesiden og admin må stå her, ellers laster
        # siden fint og alle kall feiler.
        value: https://kortsalg.korthaien.no,https://admin.kortsalg.korthaien.no
      - key: MYSTORE_URL
        sync: false
      - key: MYSTORE_KEY
        sync: false
      - key: RESEND_KEY
        sync: false
      # Avsender må ligge på et domene som er verifisert i Resend.
      - key: EPOST_FRA
        value: Korthaien <ordre@korthaien.no>
      # korthaien.no mottar ikke e-post, så svar må styres til Gmail.
      - key: EPOST_SVAR
        value: korthaien@gmail.com
      - key: EPOST_TIL_MEG
        value: korthaien@gmail.com
      - key: ADMIN_URL
        value: https://admin.kortsalg.korthaien.no
      # Butikken. Stripe-lenkene og «glemt passord» sender kunden hit.
      # Butikken bor i admin til den flyttes til korthaien.no; da endres
      # bare denne.
      - key: SHOP_URL
        value: https://admin.kortsalg.korthaien.no
      # Hvor butikken leser beholdningen fra. «mystore» (standard) fram til
      # overgangen; settes til «bok» i samme operasjon som lagerboken tømmes
      # og får ny åpningspostering.
      - key: LAGERKILDE
        value: mystore
      # Stripe: hemmelig nøkkel (sk_test_… i testmodus) og signeringsnøkkelen
      # til webhooken https://api.kortsalg.korthaien.no/api/stripe/webhook.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Settes til 1 når Stripe har gitt kontoen tilgang til Vipps.
      - key: STRIPE_VIPPS
        sync: false
      # Vipps med egen avtale (ePayment API). Nøklene fra portal.vippsmobilepay.com
      # → Utvikler → API-keys. Er alle fire satt, får kassen et Vipps-valg, og
      # Vipps gjennom Stripe slås av. VIPPS_TEST=1 bruker testmiljøet.
      - key: VIPPS_CLIENT_ID
        sync: false
      - key: VIPPS_CLIENT_SECRET
        sync: false
      - key: VIPPS_SUBSCRIPTION_KEY
        sync: false
      - key: VIPPS_MSN
        sync: false
      - key: VIPPS_TEST
        sync: false
      # Google-innlogging. Knappen vises først når begge er satt.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # Kundesiden. Statiske filer — Vite bygger dem, Render serverer dem.
  # VITE_API_URL bakes inn ved bygging, ikke ved kjøring, så en endring her
  # krever et nytt bygg.
  - type: web
    name: korthaien-kjop-kunde
    runtime: static
    rootDir: korthaien-kjop/kunde
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://api.kortsalg.korthaien.no

  # Admin. Samme opplegg, men beskyttet av passord og engangskode.
  - type: web
    name: korthaien-kjop-admin
    runtime: static
    rootDir: korthaien-kjop/admin
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://api.kortsalg.korthaien.no

  # Den offentlige butikken — det som skal ligge på korthaien.no. Bygges fra
  # admin-mappa med egen inngang (butikk.html), så admin ikke følger med.
  # Alle stier skrives om til index.html: butikken styrer selv hva som vises.
  # Når domenet kobles til: sett SHOP_URL og BUTIKK_ORIGIN på API-et til
  # https://korthaien.no.
  - type: web
    name: korthaien-butikk
    runtime: static
    rootDir: korthaien-kjop/admin
    buildCommand: npm ci && npm run build:butikk
    staticPublishPath: ./dist-butikk
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://api.kortsalg.korthaien.no

  # Scryfall oppdaterer bulk-filene daglig. Kjøres nattestid.
  - type: cron
    name: korthaien-kjop-import
    runtime: node
    rootDir: korthaien-kjop
    region: frankfurt
    schedule: "0 3 * * *"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/cli.js import
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      # Uten denne feiler jobben i stillhet — du får ingen beskjed.
      - key: RESEND_KEY
        sync: false
      - key: EPOST_FRA
        value: Korthaien <ordre@korthaien.no>
      - key: EPOST_TIL_MEG
        value: korthaien@gmail.com

  # Beholdningen endrer seg gjennom dagen, men to kjøringer holder: kvoten
  # tåler å være noen timer gammel, og hver kjøring koster tusenvis av kall
  # til Mystore.
  #
  # Tidene er UTC, som alle cron-tider hos Render. 00 og 12 UTC er 02 og 14
  # norsk sommertid, 01 og 13 om vinteren — altså én om natta og én midt på
  # dagen, ikke to om natta.
  - type: cron
    name: korthaien-kjop-mystore
    runtime: node
    rootDir: korthaien-kjop
    region: frankfurt
    schedule: "0 0,12 * * *"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/cli.js mystore
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: MYSTORE_URL
        sync: false
      - key: MYSTORE_KEY
        sync: false
      # Uten denne feiler jobben i stillhet — du får ingen beskjed.
      - key: RESEND_KEY
        sync: false
      - key: EPOST_FRA
        value: Korthaien <ordre@korthaien.no>
      - key: EPOST_TIL_MEG
        value: korthaien@gmail.com
